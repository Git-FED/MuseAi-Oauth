name = "museai-oauth"
main = "worker.js"
compatibility_date = "2026-10-28"
workers_dev = false

# Create a NEW namespace and replace this placeholder before any authorized deployment.
# Never reuse another relay's namespace and never put secret values here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "3d87785008fb439990fb9dde9490c152"

# This is not signing-key rotation. See docs/KEY-ROTATION.md before enabling.
[triggers]
crons = []

# Set ISSUER only after a custom domain is attached.
# [vars]
# ISSUER = "https://login.example.com"
